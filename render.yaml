services:
  - type: worker
    name: telegram-refer-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
